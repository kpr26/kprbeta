<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="elec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Subtle Circular Dial -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="8"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#primary)" stroke-width="6" stroke-dasharray="16 12" opacity="0.6"/>

  <!-- Meter Gauge Arc -->
  <path d="M 136 340 A 150 150 0 1 1 376 340" fill="none" stroke="url(#primary)" stroke-width="18" stroke-linecap="round"/>

  <!-- Electricity Bolt -->
  <path d="M 270 120 L 190 260 L 250 260 L 230 380 L 330 230 L 270 230 Z" fill="url(#elec)" filter="url(#glow)"/>

  <!-- Water Drop in corner -->
  <path d="M 330 280 C 330 280 370 330 370 355 C 370 377 352 395 330 395 C 308 395 290 377 290 355 C 290 330 330 280 330 280 Z" fill="url(#water)" opacity="0.9" filter="url(#glow)"/>

  <!-- Center Hub -->
  <circle cx="256" cy="270" r="14" fill="#ffffff" opacity="0.9"/>
</svg>
